<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>திருமுறைத் தலங்கள் அட்டவணை</title>
    <style>
        body {
            font-family: 'Latha', 'Aruna', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #b33939;
        }
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"] {
            width: 50%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #b33939;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        a {
            color: #2980b9;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>தேவாரத் திருத்தலங்கள் அட்டவணை</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="தலங்கள் அல்லது பதிகம் தேடு..." onkeyup="searchTable()">
    </div>

    <table id="thirumuraiTable">
        <thead>
            <tr>
                <th>எண்</th>
                <th>தலம்</th>
                <th>மொத்த பாடல்கள்</th>
                <th>அருளியவர்</th>
                <th>திருமுறை</th>
                <th>பதிக எண்</th>
                <th>பண்</th>
                <th>பதிகம்</th>
                <th>Shaivam Link</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Data will be loaded dynamically via JavaScript -->
        </tbody>
    </table>

    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const tbody = document.getElementById('tableBody');
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    // Create Shaivam link using the first or main Pathigam name
                    const pathigamValue = encodeURIComponent(row.பதிகம்.split(',')[0].trim());
                    const shaivamLink = `https://shaivam.org/thirumuraiSearch/search/?searchThirumurai=${pathigamValue}`;

                    tr.innerHTML = `
                        <td>${row.எண்}</td>
                        <td>${row.தலம்}</td>
                        <td>${row.மொத்த_பாடல்கள்}</td>
                        <td>${row.அருளியவர்}</td>
                        <td>${row.திருமுறை}</td>
                        <td>${row.பதிக_எண்}</td>
                        <td>${row.பண்}</td>
                        <td>${row.பதிகம்}</td>
                        <td><a href="${shaivamLink}" target="_blank">View on Shaivam</a></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading JSON data:', error);
            }
        }

        function searchTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.getElementById('tableBody').getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                const textValue = rows[i].textContent.toLowerCase();
                rows[i].style.display = textValue.includes(input) ? '' : 'none';
            }
        }

        window.onload = loadData;
    </script>

</body>
</html>
