.container{max-width:1250px;margin:auto;padding:20px}

.page{min-width:38px}
.page.active{background:var(--a);color:#fff;border-color:var(--a)}

let sortCol=0,sortDir=1,page=1;
const $=id=>document.getElementById(id);
HEAD.forEach((h,i)=>{
 const th=document.createElement('th'); th.textContent=h+' ↕';
 th.onclick=()=>{if(sortCol===i)sortDir*=-1;else{sortCol=i;sortDir=1}page=1;render()};
 $('head').appendChild(th);
});
function norm(v){return String(v??'').toLocaleLowerCase('ta-IN').trim()}
function rows(){
 const q=norm($('search').value);
 let a=DATA.filter(r=>!q||r.some(c=>norm(c.text).includes(q)));
 a.sort((x,y)=>norm(x[sortCol].text).localeCompare(norm(y[sortCol].text),'ta-IN',{numeric:true,sensitivity:'base'})*sortDir);
 return a;
}
function render(){
 const a=rows(),n=+$('size').value,pages=Math.max(1,Math.ceil(a.length/n));
 if(page>pages)page=pages;
 const start=(page-1)*n,view=a.slice(start,start+n);
 $('body').innerHTML='';
 if(!view.length) $('body').innerHTML='<tr><td class="empty" colspan="'+HEAD.length+'">தேடலுக்கு பொருத்தமான தலம் எதுவும் கிடைக்கவில்லை.</td></tr>';
 view.forEach(r=>{
   const tr=document.createElement('tr');
   r.forEach(c=>{
     const td=document.createElement('td');
     if(c.url){
       const a=document.createElement('a'); a.className='link';a.href=c.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open Shaivam';td.appendChild(a);
     } else td.textContent=c.text;
     tr.appendChild(td);
   });
   $('body').appendChild(tr);
 });
 $('info').textContent=(a.length?start+1:0)+'–'+Math.min(start+view.length,a.length)+' of '+a.length+' temples (total '+DATA.length+')';
 $('pages').innerHTML='';
 const add=(label,p,active=false)=>{const b=document.createElement('button');b.className='page'+(active?' active':'');b.textContent=label;b.disabled=p<1||p>pages;b.onclick=()=>{page=p;render()};$('pages').appendChild(b)};
 add('‹',page-1);
 let first=Math.max(1,page-3),last=Math.min(pages,first+6);first=Math.max(1,last-6);
 for(let p=first;p<=last;p++)add(p,p,p===page);
 add('›',page+1);
}
$('search').oninput=()=>{page=1;render()};
$('size').onchange=()=>{page=1;render()};
$('clear').onclick=()=>{$('search').value='';page=1;render()};
render();
</script>
